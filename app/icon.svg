<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="brand-inner-glow" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="1" stop-color="transparent" />
    </linearGradient>
  </defs>
  <!-- Squircle Glass Frame -->
  <rect x="2" y="2" width="32" height="32" rx="10" fill="#152229" stroke="url(#brand-grad)" stroke-width="1.8" />
  <rect x="3" y="3" width="30" height="30" rx="9" fill="url(#brand-inner-glow)" />
  <!-- Pulse Frequency Waveform & Play Signal -->
  <path d="M8 18h4.5l2.5-5.5 3.5 11 3-6.5h3" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
